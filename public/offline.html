<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSP Mobile Offline</title>
    <style>
        :root {
            color-scheme: light;
            --primary: #5b37e5;
            --ink: #101333;
            --muted: #737997;
            --line: #e8eaf6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background: linear-gradient(180deg, #fbfbff 0%, #eef1fb 100%);
        }

        main {
            width: min(100%, 420px);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 28px;
            text-align: center;
            background: #fff;
            box-shadow: 0 18px 44px rgba(31, 35, 85, 0.08);
        }

        .mark {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            border-radius: 22px;
            display: grid;
            place-items: center;
            color: #fff;
            background: linear-gradient(135deg, #7557f6, #4c29d9);
            font-size: 28px;
            font-weight: 900;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.3rem;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.55;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <div class="mark">MSP</div>
        <h1>Koneksi Terputus</h1>
        <p>Beberapa halaman aplikasi tetap bisa dibuka, tapi input penjualan dan sinkronisasi data membutuhkan internet.</p>
    </main>
</body>
</html>
